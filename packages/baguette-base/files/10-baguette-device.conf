# Virtual hardware unconditionally attached by vm_concierge/crosvm before vCPU0
# starts (termina_vm.cc: vm_tools.img LABEL=cros-vm-tools, virtio-vsock --cid,
# virtio-console console=hvc0). Kernel devices exist immediately; .device
# readiness only waits for systemd-udevd coldplug to process uevents and apply
# TAG+="systemd" / by-label symlinks. Under heavy host CPU contention coldplug
# can exceed DefaultDeviceTimeoutSec=90s, permanently cancelling
# opt-google-cros\x2dcontainers.mount, maitred, vshd, and serial-getty@hvc0.
[Unit]
JobRunningTimeoutSec=infinity
